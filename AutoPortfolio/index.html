<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1 id="site-title">Loading...</h1>
        <p id="site-subtitle">Loading...</p>
        <nav class="main-nav">
            <a href="index.html" class="nav-link active">Home</a>
            <a href="feed.html" class="nav-link">Feed</a>
        </nav>
    </header>

    <main class="portfolio-container">
        
        <section class="cover-section">
            <div class="cover-item"><img id="hero-1" src="" alt="Cover 1" class="gallery-img"></div>
            <div class="cover-item"><img id="hero-2" src="" alt="Cover 2" class="gallery-img"></div>
            <div class="cover-item"><img id="hero-3" src="" alt="Cover 3" class="gallery-img"></div>
        </section>

        <div class="divider"></div>

        <section class="featured-section">
            <div class="featured-text">
                <h2 id="main-headline">Loading...</h2>
                <p id="main-description">Loading description...</p>
            </div>
            <div class="featured-image">
                <img id="feature-image" src="" alt="Featured Car" class="gallery-img">
            </div>
        </section>

        <div class="divider"></div>

        <section id="bottom-gallery-container" class="individual-section">
            <!-- Dynamic gallery images will load here -->
        </section>

    </main>

    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Full resolution view">
    </div>

    <script src="script.js"></script>
    <script src="home-script.js"></script>
</body>
</html>
